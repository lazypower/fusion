contents:
  repositories:
    - https://packages.wolfi.dev/os
    - '@local ./packages'
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - wolfi-base
    - wget
    - fusion@local

accounts:
  groups:
    - groupname: fusion
      gid: 101
  users:
    - username: fusion
      uid: 100
      gid: 101
      shell: /sbin/nologin
  run-as: fusion

paths:
  - path: /data
    type: directory
    uid: 100
    gid: 101
    permissions: 0o755

entrypoint:
  command: /usr/bin/fusion

environment:
  DB: /data/fusion.db

archs:
  - amd64
